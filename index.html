    button{

}

  width:12%;
}

#estimateSection table.list-table th:nth-child(7),
#estimateSection table.list-table td:nth-child(7){
  width:12%;
}

#estimateSection table.list-table th:nth-child(8),

  document.getElementById("loadingText").innerText =
    msg || "処理中です...";
  document.getElementById("loadingLayer").style.display =
    "block";
}

function hideLoading(){
  document.getElementById("loadingLayer").style.display =
    "none";
}
  
  let currentUser = null;
  let estimateRowCount = 0;
  const estimateMinRows = 10;

  document.getElementById("loadingLayer").style.display =
    "none";
}

function login(){

  const loginId = document.getElementById("loginId").value;
  const password = document.getElementById("password").value;

  google.script.run
    .withSuccessHandler(function(res){

      if(res.success){

        

        currentUser = res;

        document.getElementById("loginArea").style.display = "none";
        document.getElementById("mainArea").style.display = "block";

        document.getElementById("welcome").innerText =
          "ようこそ " + res.userName + " さん";

  function addEstimateRow(shouldRecalc = true){

  function applyLineTypeRow(rowNo){
    const lineType = document.getElementById("lineType" + rowNo).value;
    const row = document.getElementById("estimateRow" + rowNo);

    const qty = document.getElementById("qty" + rowNo);
    const unit = document.getElementById("unit" + rowNo);
    const specification = document.getElementById("specification" + rowNo);
    const costPrice = document.getElementById("costPrice" + rowNo);
    const sellPrice = document.getElementById("sellPrice" + rowNo);
    const amount = document.getElementById("amount" + rowNo);
    const remark = document.getElementById("remark" + rowNo);

    row.classList.remove("estimate-line-disabled", "estimate-line-header", "estimate-line-note");

    if(lineType === "DETAIL"){
      qty.disabled = false;
      unit.disabled = false;
      costPrice.disabled = false;
      specification.disabled = false;
      remark.disabled = false;
      sellPrice.disabled = true;
      amount.disabled = true;
    } else {
      qty.value = "";
      unit.value = "";
      costPrice.value = "";
      sellPrice.value = "";
      amount.value = "";
      remark.value = "";

      qty.disabled = true;
      unit.disabled = true;
      costPrice.disabled = true;
      remark.disabled = true;
      sellPrice.disabled = true;
      amount.disabled = true;

      specification.value = "";
specification.disabled = true;

      row.classList.add("estimate-line-disabled");

      if(lineType === "HEADER"){
        row.classList.add("estimate-line-header");
      }

      if(lineType === "NOTE"){
        row.classList.add("estimate-line-note");
      }
    }

    calcEstimateTotals();
  }

  function calcEstimateTotals(){
  let subtotal = 0;

  const globalRate = Number(document.getElementById("globalRate")?.value || 1);

  for(let i = 1; i <= estimateRowCount; i++){
    const lineTypeEl = document.getElementById("lineType" + i);
    if(!lineTypeEl) continue;

    const lineType = lineTypeEl.value;
    const qty = Number(document.getElementById("qty" + i)?.value || 0);
    const costPrice = Number(document.getElementById("costPrice" + i)?.value || 0);

    let sellPrice = 0;
    let amount = 0;

    if(lineType === "DETAIL"){
      sellPrice = costPrice < 0
        ? costPrice
        : Math.round(costPrice * globalRate);

      amount = qty * sellPrice;
      subtotal += amount;
    }

    const sellPriceEl = document.getElementById("sellPrice" + i);
    const amountEl = document.getElementById("amount" + i);

    if(sellPriceEl){
      sellPriceEl.value = sellPrice;
      sellPriceEl.style.color = sellPrice < 0 ? "#d32f2f" : "";
      sellPriceEl.style.fontWeight = sellPrice < 0 ? "800" : "";
    }

    if(amountEl){
      amountEl.value = amount;
      amountEl.style.color = amount < 0 ? "#d32f2f" : "";
      amountEl.style.fontWeight = amount < 0 ? "800" : "";
    }
  }

  const taxRate = Number(document.getElementById("taxRate")?.value || 0);
  const taxable = subtotal;
  const tax = Math.round(taxable * taxRate);
  const grandTotal = taxable + tax;

  const taxableView = document.getElementById("taxableView");
  const taxView = document.getElementById("taxView");
  const grandTotalView = document.getElementById("grandTotalView");

  if(taxableView) taxableView.innerText = taxable.toLocaleString();
  if(taxView) taxView.innerText = tax.toLocaleString();
  if(grandTotalView) grandTotalView.innerText = grandTotal.toLocaleString();
}

      });

discount1Amount: 0,

discount3Amount: 0,

function filterTable(containerId, keyword){
  const container = document.getElementById(containerId);
  if(!container) return;

  const table = container.querySelector("table");
  if(!table) return;

  const rows = table.querySelectorAll("tr");
  const key = String(keyword || "").toLowerCase().trim();

  for(let i = 1; i < rows.length; i++){
    const text = rows[i].innerText.toLowerCase();
    rows[i].style.display = text.includes(key) ? "" : "none";
  }
}


function duplicateEstimate(estimateId){

  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const headerSh = ss.getSheetByName("見積ヘッダ");
  const detailSh = ss.getSheetByName("見積明細");

  const headers = headerSh.getDataRange().getValues();
  const details = detailSh.getDataRange().getValues();

  let source = null;

  for(let i=1;i<headers.length;i++){
    if(String(headers[i][0]).trim() === String(estimateId).trim()){
      source = headers[i];
      break;
    }
  }

  if(!source){
    throw new Error("元見積が見つかりません");
  }

  const companyId = source[1];
  const now = new Date();

  const newEstimateId = generateEstimateId(headerSh);
  const newEstimateNo = generateEstimateNo(companyId);

  const row = source.slice();

  row[0] = newEstimateId;
  row[4] = newEstimateNo;
  row[5] = Utilities.formatDate(now, Session.getScriptTimeZone(), "yyyy-MM-dd");
  row[6] = row[6] + "（コピー）";
  row[23] = "";
  row[24] = "作成中";
  row[27] = now;
  row[28] = now;

  headerSh.appendRow(row);

  for(let i=1;i<details.length;i++){
    if(String(details[i][1]).trim() === String(estimateId).trim()){

      const d = details[i].slice();

      d[0] = generateEstimateDetailId(detailSh);
      d[1] = newEstimateId;
      d[16] = now;
      d[17] = now;

      detailSh.appendRow(d);
    }
  }

  return {
    success:true,
    newEstimateId:newEstimateId,
    newEstimateNo:newEstimateNo
  };
}

function showToast(message, type){
  const toast = document.getElementById("toast");
  if(!toast) return;

  toast.className = "toast";
  if(type){
    toast.classList.add(type);
  }

  toast.innerText = message;
  toast.classList.add("show");

  setTimeout(function(){
    toast.classList.remove("show");
  }, 2600);
}

function editEstimate(estimateId){
  hideAllSections();
  document.getElementById("estimateSection").style.display = "block";

  google.script.run
    .withSuccessHandler(function(res){
      const h = res.header;
      const d = res.details || [];

      document.getElementById("editEstimateId").value = h.estimateId || "";
      document.getElementById("estimateNo").value = h.estimateNo || "";
      document.getElementById("estimateIssueDate").value = h.issueDate || "";
      document.getElementById("estimateSubject").value = h.subject || "";
      document.getElementById("estimatePaymentTerms").value = h.paymentTerms || "";
      document.getElementById("estimateRemarks").value = h.remarks || "";

      google.script.run.withSuccessHandler(function(projects){
        const select = document.getElementById("estimateProjectId");
        select.innerHTML = '<option value="">選択してください</option>';

        projects.forEach(function(p){
          const option = document.createElement("option");
          option.value = p.projectId;
          option.textContent = p.projectName + " / " + p.customerName;
          select.appendChild(option);
        });

        select.value = h.projectId || "";
      }).getProjectsForEstimate(currentUser.companyId);

      initializeEstimateRows();

      for(let i = 0; i < d.length; i++){
        if(i >= estimateRowCount){
          addEstimateRow(false);
        }

        const no = i + 1;

        document.getElementById("lineType" + no).value = d[i].lineType || "DETAIL";
        document.getElementById("itemName" + no).value = d[i].itemName || "";
        document.getElementById("specification" + no).value = d[i].specification || "";
        document.getElementById("qty" + no).value = d[i].quantity || "";
        document.getElementById("unit" + no).value = d[i].unit || "";
        document.getElementById("costPrice" + no).value = d[i].costPrice || "";
        document.getElementById("remark" + no).value = d[i].remark || "";

        applyLineTypeRow(no);
      }

      calcEstimateTotals();
    })
    .withFailureHandler(function(err){
      alert("見積読込エラー: " + err.message);
    })
    .getEstimateEditData(estimateId);
}



function saveEstimateMain(){
  const editId = document.getElementById("editEstimateId").value;

  if(editId){
    updateEstimateFromForm();
  }else{
    saveEstimate();
  }
}

function updateEstimateFromForm(){
  const details = [];

  for(let i = 1; i <= estimateRowCount; i++){
    const lineTypeEl = document.getElementById("lineType" + i);
    if(!lineTypeEl) continue;

    details.push({
      lineType: lineTypeEl.value,
      itemName: document.getElementById("itemName" + i).value,
      specification: document.getElementById("specification" + i).value,
      quantity: Number(document.getElementById("qty" + i).value || 0),
      unit: document.getElementById("unit" + i).value,
      unitPrice: Number(document.getElementById("sellPrice" + i).value || 0),
      amount: Number(document.getElementById("amount" + i).value || 0),
      remark: document.getElementById("remark" + i).value,
      costPrice: Number(document.getElementById("costPrice" + i).value || 0)
    });
  }

  let subtotal = 0;
  details.forEach(d => {
    if(d.lineType === "DETAIL"){
      subtotal += Number(d.amount || 0);
    }
  });

  const taxableAmount10 = subtotal;
  const taxRate = Number(document.getElementById("taxRate").value || 0);
  const taxAmount10 = Math.round(taxableAmount10 * taxRate);
  const grandTotal = taxableAmount10 + taxAmount10;

  const estimateData = {
    estimateId: document.getElementById("editEstimateId").value,
    companyId: currentUser.companyId,
    projectId: document.getElementById("estimateProjectId").value,
    estimateNo: document.getElementById("estimateNo").value,
    issueDate: document.getElementById("estimateIssueDate").value,
    subject: document.getElementById("estimateSubject").value,
    paymentTerms: document.getElementById("estimatePaymentTerms").value,
    remarks: document.getElementById("estimateRemarks").value,
    subtotal: subtotal,
    discount1Name: "値引",
discount1Amount: 0,
discount2Name: "特別値引",
discount2Amount: 0,
discount3Name: "端数調整",
discount3Amount: 0,
    taxableAmount10: taxableAmount10,
    taxAmount10: taxAmount10,
    grandTotal: grandTotal,
    updatedBy: currentUser.userName,
    details: details
  };

  google.script.run
    .withSuccessHandler(function(res){
      document.getElementById("estimateMsg").innerHTML =
        '<div class="success-box">上書き保存しました。見積番号：' + estimateData.estimateNo + '</div>';

      setTimeout(function(){
        showEstimateListSection();
      }, 800);
    })
    .withFailureHandler(function(err){
      document.getElementById("estimateMsg").innerText =
        "更新エラー：" + err.message;
    })
    .updateEstimate(estimateData);
}
