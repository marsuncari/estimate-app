<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>建築見積システム</title>
<style>
body{
  font-family:sans-serif;<th>PDF</th>
  background:linear-gradient(135deg,#eef2f7,#f8fafc);
  padding:30px;
}
.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:34px;
  border-radius:22px;
  box-shadow:0 18px 40px rgba(15,23,42,.12);
}
h1{
  text-align:center;
  color:#16324f;
  font-size:26px;
}
.sub{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-bottom:24px;
}
label{
  font-weight:bold;
  font-size:13px;
}
input{
  width:100%;
  padding:14px;
  margin:8px 0 16px;
  box-sizing:border-box;
  border:1px solid #d1d5db;
  border-radius:12px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#16324f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
#msg{
  color:#b42318;
  font-weight:bold;
  text-align:center;
  margin-top:14px;
}
#main{
  max-width:900px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  display:none;
}

#main{
  max-width:1100px;
}

#main button{
  width:auto;
  margin-right:10px;
  margin-bottom:10px;
}

#estimateSearch{
  width:100%;
  margin-top:18px;
  margin-bottom:18px;
}

#estimateList table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
  background:#fff;
}

#estimateList th{
  background:#16324f;
  color:#fff;
  padding:12px;
  font-size:13px;
  text-align:left;
}

#estimateList td{
  border-bottom:1px solid #e5e7eb;
  padding:12px;
  font-size:13px;
}

#estimateList tr:hover td{
  background:#f8fafc;
}

#estimateList a{
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  white-space: nowrap !important;
  min-width: 60px;   /* ←これ重要 */
  height: 36px;
  padding: 6px 10px;
  border-radius: 10px;
}

@media(max-width:768px){
  #estimateList{
    overflow-x:auto;
  }

  #estimateList table{
    min-width:900px;
  }
}  

 #estimateList tr{
  cursor:pointer;
} 

 #newProjectId{
  width:100%;
  padding:12px;
  margin-top:10px;
  margin-bottom:16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:14px;
} 

 #newProjectId{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
} 

#loadingLayer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:9999;
}

.loading-box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  padding:30px 40px;
  border-radius:20px;
  text-align:center;
}

.spinner{
  width:40px;
  height:40px;
  margin:0 auto 15px;
  border:4px solid #ddd;
  border-top:4px solid #16324f;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}  

.checkmark{
  font-size:48px;
  color:#2e7d32;
  margin-bottom:10px;
  animation:pop .4s ease;
}

@keyframes pop{
  0%{transform:scale(0);}
  70%{transform:scale(1.2);}
  100%{transform:scale(1);}
}  

 button.edit-btn{
  background:#1976d2 !important;
  color:#fff !important;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
}

button.edit-btn:hover{
  background:#1565c0 !important;
}

button.invoice-btn{
  white-space: nowrap;
  padding:8px 14px;
  border-radius:10px;
  background:#2e7d32;
  color:#fff;
  border:none;
  font-weight:bold;
}  

.action-btns{
  display:flex;
  gap:6px;
}

.copy-btn{
  background:#1976d2;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:8px;
}

.delete-btn{
  background:#c62828;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:8px;
}  

button{
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-1px);
}  


#estimateList button{
  white-space: nowrap !important;
  padding:8px 12px;
  border-radius:10px;
  font-weight:bold;
  min-width:70px;
}

#estimateList td:last-child{
  display:flex;
  gap:8px;
}

/* 見積一覧：列幅とボタン配置を整える */
#estimateList table{
  table-layout: auto;
}

#estimateList th,
#estimateList td{
  vertical-align: middle;
  white-space: nowrap;
}

#estimateList td:nth-child(5){
  white-space: normal; /* 件名だけ長文OK */
  min-width: 120px;
}

#estimateList td:nth-child(8),
#estimateList td:nth-child(9),
#estimateList td:nth-child(10){
  text-align: center;
}

/* PDF・編集・請求書ボタンを横文字固定 */
#estimateList a,
#estimateList button{
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  white-space: nowrap !important;
  min-width: 70px;
  height: 36px;
  padding: 6px 12px;
  border-radius: 10px;
  font-weight:bold;
}

/* PDF 開く */
#estimateList a{
  background:#2e7d32 !important;
  color:#fff !important;
  text-decoration:none !important;
}

/* 編集 */
#estimateList button.edit-btn{
  background:#1976d2 !important;
  color:#fff !important;
  border:none !important;
}

/* 請求書作成 */
#estimateList button.invoice-btn{
  background:#2e7d32 !important;
  color:#fff !important;
  border:none !important;
  min-width: 110px;
}  

/* 一覧ボタン共通 */
#estimateList a,
#estimateList button{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  white-space:nowrap !important;
  height:38px !important;
  padding:0 16px !important;
  border-radius:10px !important;
  font-weight:bold !important;
  border:none !important;
  line-height:1 !important;
  box-sizing:border-box !important;
  text-decoration:none !important;
}

/* 開く：緑 */
#estimateList a{
  background:#2e7d32 !important;
  color:#fff !important;
  min-width:72px !important;
}

/* 編集：青 */
#estimateList button.edit-btn{
  background:#1976d2 !important;
  color:#fff !important;
  min-width:72px !important;
}

/* 請求書作成：オレンジ */
#estimateList button.invoice-btn{
  background:#f57c00 !important;
  color:#fff !important;
  min-width:118px !important;
}

/* hover */
#estimateList a:hover{
  background:#256b2a !important;
}

#estimateList button.edit-btn:hover{
  background:#1565c0 !important;
}

#estimateList button.invoice-btn:hover{
  background:#ef6c00 !important;
}

/* 開く・編集・請求書ボタン完全統一 */
#estimateList a,
#estimateList button{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  height:40px !important;        /* ←高さ統一 */
  padding:0 16px !important;     /* ←上下padding消す */
  line-height:1 !important;
  border-radius:10px !important;
  font-weight:bold !important;
  border:none !important;
  box-sizing:border-box !important;
  white-space:nowrap !important;
}

/* aタグ特有のズレ修正 */
#estimateList a{
  text-decoration:none !important;
}  

#estimateList td{
  vertical-align: middle;
}  
  
</style>
</head>
<body>

<div id="login" class="login-box">
  <h1>建築見積システム</h1>
  <div class="sub">Estimate & Invoice Management</div>

  <label>ログインID</label>
  <input id="loginId" type="text">

  <label>パスワード</label>
  <input id="password" type="password">

  <button onclick="login()">ログイン</button>

  <div id="msg"></div>
</div>

<div id="main">
  <h2 id="welcome"></h2>

  <button onclick="loadEstimateList()">見積一覧を表示</button>
  <button onclick="logout()">ログアウト</button>

   <div style="margin-top:20px; padding:15px; background:#f1f5f9; border-radius:10px;">
  <h3>新規見積作成</h3>

   
   <button type="button" onclick="toggleCustomerForm()">＋ 新規顧客追加</button> 
   <button type="button" onclick="toggleProjectForm()">＋ 新規案件追加</button>

    <div id="customerForm" style="display:none; margin-top:15px; padding:15px; background:#fff; border-radius:10px;">
  <h4>新規顧客追加</h4>

  <input id="customerName" placeholder="顧客名">
  <input id="customerDept" placeholder="部署名">
  <input id="customerPerson" placeholder="担当者名">
  <input id="customerTel" placeholder="電話番号">
  <input id="customerEmail" placeholder="メール">

  <button type="button" onclick="saveCustomerFromUI()">顧客を保存</button>
</div> 

   <div id="projectForm" style="display:none; margin-top:15px; padding:15px; background:#fff; border-radius:10px;">
  <h4>新規案件追加</h4>

  <select id="projectCustomerId">
    <option value="">顧客を選択してください</option>
  </select>

  <input id="projectName" placeholder="案件名">
  <input id="constructionName" placeholder="工事内容">
  <input id="siteName" placeholder="現場名">
  <input id="siteAddress" placeholder="現場住所">
  <input id="projectPaymentTerms" placeholder="支払い条件" value="ご請求書発行後1ヶ月以内">

  <button type="button" onclick="saveProjectFromEstimate()">案件を保存</button>
</div>  

   <select id="newProjectId">
  <option value="">案件を選択してください</option>
　　</select>

  <div id="selectedCustomer" style="margin-bottom:10px; font-weight:bold; color:#16324f;">
  顧客：-
</div>   

    <div id="estimateNoPreview" style="margin-bottom:10px; font-weight:bold; color:#0f172a;">
  見積番号：-
</div> 

  <input id="newSubject" placeholder="件名（例：内装工事）">

<h4>見積明細</h4>

<div style="margin-bottom:10px;">
  掛け率：
  <input id="globalRate" type="number" step="0.01" value="1.5"
    style="width:90px; padding:8px;"
    oninput="calcDetailTotals()">
</div>     

<table id="detailTable" style="width:100%; border-collapse:collapse; margin-bottom:12px;">
  <thead>
    <tr style="background:#e5e7eb;">
  <th>種別</th>
  <th>項目</th>
  <th>仕様</th>
  <th>数量</th>
  <th>単位</th>
  <th>仕入単価</th>
  <th>見積単価</th>
  <th>金額</th>
  <th>備考</th>
  <th></th>
</tr>
  </thead>
  <tbody id="detailBody"></tbody>
</table>

<button type="button" onclick="addDetailRow()">＋ 明細追加</button>

<div style="margin-top:14px; text-align:right; font-weight:bold;">
  <div>小計：<span id="subtotalPreview">0</span>円</div>
  <div>消費税：<span id="taxPreview">0</span>円</div>
  <div style="font-size:18px;">合計：<span id="totalPreview">0</span>円</div>
</div>

<button onclick="saveEstimate()">保存</button>
</div>

  <input id="estimateSearch" placeholder="顧客名・案件名・見積番号で検索" oninput="renderEstimateList()" style="margin-top:20px;">

  <div id="estimateList"></div>
</div>
 
 

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwWXaFfTmenoNAG8BBO4hxwB6cd69TYocFIx-s9uKIUPz27_tiedtbPGIA_f8kSaYLkTA/exec";
let currentUser = null;
let editingEstimateId = null;  

function login(){
  const loginId = document.getElementById("loginId").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!loginId || !password){
    document.getElementById("msg").innerText = "ログインIDとパスワードを入力してください";
    return;
  }

  document.getElementById("msg").innerText = "ログイン確認中...";

  const url =
    GAS_URL +
    "?api=1&action=login" +
    "&loginId=" + encodeURIComponent(loginId) +
    "&password=" + encodeURIComponent(password);

  fetch(url)
    .then(res => res.json())
    .then(res => {
      if(res.success){
        currentUser = res;

        document.getElementById("login").style.display = "none";
        document.getElementById("main").style.display = "block";
        document.getElementById("welcome").innerText =
          "ようこそ " + res.userName + " さん";

        loadEstimateList();
      loadProjectsForSelect();
        loadNewEstimateNo(); // ←これ追加
        initDetailRows();

      }else{
        document.getElementById("msg").innerText =
          "ログインID または パスワードが違います";
      }
    })
    .catch(err => {
      document.getElementById("msg").innerText =
        "通信エラーです。GAS URLまたはデプロイ設定を確認してください。";
      console.error(err);
    });
}

function logout(){
  currentUser = null;
  document.getElementById("main").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("password").value = "";
  document.getElementById("msg").innerText = "";
}


let estimateData = [];

function loadEstimateList(){
  if(!currentUser){
    alert("ログインしてください");
    return;
  }

  document.getElementById("estimateList").innerHTML = "読み込み中...";

  const url =
    GAS_URL +
    "?api=1&action=estimateList" +
    "&companyId=" + encodeURIComponent(currentUser.companyId);

  fetch(url)
    .then(res => res.json())
    .then(data => {
      estimateData = data || [];
      renderEstimateList();
    })
    .catch(err => {
      document.getElementById("estimateList").innerHTML =
        "見積一覧の取得に失敗しました";
      console.error(err);
    });
}

function renderEstimateList(){
  const keyword = document.getElementById("estimateSearch").value.trim().toLowerCase();
  const area = document.getElementById("estimateList");

  const filtered = estimateData.filter(row => {
    return (
      String(row.estimateNo || "").toLowerCase().includes(keyword) ||
      String(row.customerName || "").toLowerCase().includes(keyword) ||
      String(row.projectName || "").toLowerCase().includes(keyword) ||
      String(row.subject || "").toLowerCase().includes(keyword)
    );
  });

  if(filtered.length === 0){
    area.innerHTML = "<p>見積データがありません。</p>";
    return;
  }

  let html = `
    <table>
      <tr>
        <th>見積番号</th>
        <th>発行日</th>
        <th>顧客名</th>
        <th>案件名</th>
        <th>件名</th>
        <th>金額</th>
        <th>状態</th>
        <th>PDF</th>
        <th>編集</th>
　　　　 <th>請求書</th>
      </tr>
  `;

  filtered.forEach(row => {
    html += `
      <tr onclick="openPdf('${row.pdfUrl}')">
        <td>${escapeHtml(row.estimateNo)}</td>
        <td>${escapeHtml(row.issueDate)}</td>
        <td>${escapeHtml(row.customerName)}</td>
        <td>${escapeHtml(row.projectName)}</td>
        <td>${escapeHtml(row.subject)}</td>
        <td>${Number(row.grandTotal || 0).toLocaleString()}円</td>
        <td>${escapeHtml(row.status)}</td>
        <td>
          ${row.pdfUrl 
  ? `<a href="${row.pdfUrl}" target="_blank" onclick="event.stopPropagation()">開く</a>` 
  : ""
}
        </td>

        <td>
        <button class="edit-btn" onclick="event.stopPropagation(); editEstimate('${row.estimateId}')">
  編集
</button>
      </td>

        <td>
  <button class="invoice-btn" onclick="event.stopPropagation(); createInvoiceFromEstimateWeb('${row.estimateId}')">
  請求書作成
</button>
</td>
      </tr>
    `;
  });

  html += "</table>";
  area.innerHTML = html;
}

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function openPdf(url){
  if(url){
    window.open(url, "_blank");
  }
}
function addDetailRow(copyData){
  const tbody = document.getElementById("detailBody");
  const tr = document.createElement("tr");

  const lineType = copyData?.lineType || "DETAIL";

  tr.innerHTML = `
    <td>
      <select class="d-lineType" onchange="applyLineType(this.closest('tr')); calcDetailTotals();">
        <option value="DETAIL" ${lineType === "DETAIL" ? "selected" : ""}>通常</option>
        <option value="HEADER" ${lineType === "HEADER" ? "selected" : ""}>タイトル</option>
        <option value="NOTE" ${lineType === "NOTE" ? "selected" : ""}>コメント</option>
        <option value="BLANK" ${lineType === "BLANK" ? "selected" : ""}>空白</option>
      </select>
    </td>
    <td><input class="d-item" placeholder="項目" value="${copyData?.itemName || ""}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-spec" placeholder="仕様" value="${copyData?.specification || ""}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-qty" type="number" value="${copyData?.quantity || 1}" oninput="calcDetailTotals()" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-unit" placeholder="式" value="${copyData?.unit || ""}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-cost" type="number" value="${copyData?.costPrice || 0}" oninput="calcDetailTotals()" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-price" type="number" value="${copyData?.unitPrice || 0}" oninput="calcDetailTotals()" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-amount" type="number" value="0" readonly></td>
    <td><input class="d-remark" placeholder="備考" value="${copyData?.remark || ""}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td>
  <div class="action-btns">
    <button type="button" class="copy-btn" onclick="copyDetailRow(this)">複製</button>
    <button type="button" class="delete-btn" onclick="this.closest('tr').remove(); calcDetailTotals();">削除</button>
  </div>
</td>
  `;

  tbody.appendChild(tr);
  applyLineType(tr);
  calcDetailTotals();
}

function addTitleRow(){
  addDetailRow({
    lineType: "HEADER",
    itemName: "【工事項目】",
    quantity: "",
    unit: "",
    costPrice: 0,
    unitPrice: 0
  });
}

function addCommentRow(){
  addDetailRow({
    lineType: "NOTE",
    itemName: "※コメントを入力してください",
    quantity: "",
    unit: "",
    costPrice: 0,
    unitPrice: 0
  });
}

function addBlankRow(){
  addDetailRow({
    lineType: "BLANK",
    itemName: "",
    quantity: "",
    unit: "",
    costPrice: 0,
    unitPrice: 0
  });
}

function addDiscountRow(){
  addDetailRow({
    lineType: "DETAIL",
    itemName: "値引き",
    quantity: 1,
    unit: "式",
    costPrice: 0,
    unitPrice: -1000
  });
}  

function applyLineType(tr){
  const lineType = tr.querySelector(".d-lineType").value;

  const item = tr.querySelector(".d-item");
  const spec = tr.querySelector(".d-spec");
  const qty = tr.querySelector(".d-qty");
  const unit = tr.querySelector(".d-unit");
  const cost = tr.querySelector(".d-cost");
  const price = tr.querySelector(".d-price");
  const amount = tr.querySelector(".d-amount");
  const remark = tr.querySelector(".d-remark");

  const isDetail = lineType === "DETAIL";

  [qty, unit, cost, price, amount].forEach(el => {
    el.disabled = !isDetail;
  });

  if(lineType === "HEADER"){
    tr.style.background = "#e9ecef";
    item.placeholder = "タイトル";
    spec.disabled = true;
    remark.disabled = true;
  }else if(lineType === "NOTE"){
    tr.style.background = "#fffbe6";
    item.placeholder = "コメント";
    spec.disabled = true;
    remark.disabled = false;
  }else if(lineType === "BLANK"){
    tr.style.background = "#fff";
    item.value = "";
    spec.value = "";
    remark.value = "";
  }else{
    tr.style.background = "";
    item.placeholder = "項目";
    spec.disabled = false;
    remark.disabled = false;
  }
}  

function handleEnterKey(e){
  if(e.key !== "Enter") return;

  e.preventDefault();

  const current = e.target;
  const td = current.closest("td");
  const tr = current.closest("tr");

  const cells = Array.from(tr.querySelectorAll("input:not([readonly])"));
  const index = cells.indexOf(current);

  // 同じ行の次のセルへ
  if(index < cells.length - 1){
    cells[index + 1].focus();
    cells[index + 1].select();
  }else{
    // 次の行へ
    const nextTr = tr.nextElementSibling;

    if(nextTr){
      const nextInput = nextTr.querySelector("input:not([readonly])");
      if(nextInput){
        nextInput.focus();
        nextInput.select();
      }
    }else{
      // 最終行なら新規追加
      addDetailRow();

      const newTr = tr.nextElementSibling;
      if(newTr){
        const firstInput = newTr.querySelector("input:not([readonly])");
        if(firstInput){
          firstInput.focus();
        }
      }
    }
  }
}

function handleArrowKey(e){
  if(e.key !== "ArrowDown" && e.key !== "ArrowUp") return;

  e.preventDefault();

  const current = e.target;
  const tr = current.closest("tr");
  const allRows = Array.from(document.querySelectorAll("#detailBody tr"));
  const rowIndex = allRows.indexOf(tr);

  const currentInputs = Array.from(tr.querySelectorAll("input:not([readonly])"));
  const colIndex = currentInputs.indexOf(current);

  if(colIndex === -1) return;

  let targetRow = null;

  if(e.key === "ArrowDown"){
    targetRow = allRows[rowIndex + 1];

    // 最終行で↓を押したら新規行追加
    if(!targetRow){
      addDetailRow();
      const updatedRows = Array.from(document.querySelectorAll("#detailBody tr"));
      targetRow = updatedRows[rowIndex + 1];
    }
  }

  if(e.key === "ArrowUp"){
    targetRow = allRows[rowIndex - 1];
  }

  if(!targetRow) return;

  const targetInputs = Array.from(targetRow.querySelectorAll("input:not([readonly])"));
  const targetInput = targetInputs[colIndex];

  if(targetInput){
    targetInput.focus();
    targetInput.select();
  }
}
  
function copyDetailRow(btn){
  const tr = btn.closest("tr");

  const data = {
    itemName: tr.querySelector(".d-item").value,
    specification: tr.querySelector(".d-spec").value,
    quantity: tr.querySelector(".d-qty").value,
    unit: tr.querySelector(".d-unit").value,
    unitPrice: tr.querySelector(".d-price").value,
    remark: tr.querySelector(".d-remark").value
  };

  const newTr = document.createElement("tr");

  newTr.innerHTML = `
    <td><input class="d-item" value="${data.itemName}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-spec" value="${data.specification}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-qty" type="number" value="${data.quantity}" oninput="calcDetailTotals()" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-unit" value="${data.unit}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-price" type="number" value="${data.unitPrice}" oninput="calcDetailTotals()" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td><input class="d-amount" type="number" readonly></td>
    <td><input class="d-remark" value="${data.remark}" onkeydown="handleEnterKey(event); handleArrowKey(event)"></td>
    <td>
      <button type="button" onclick="copyDetailRow(this)">複製</button>
      <button type="button" onclick="this.closest('tr').remove(); calcDetailTotals();">削除</button>
    </td>
  `;
  
  // 🔥 ここがポイント（直下に追加）
  tr.after(newTr);

  calcDetailTotals();
}

function initDetailRows(){
  const tbody = document.getElementById("detailBody");
  tbody.innerHTML = "";

  for(let i = 0; i < 5; i++){
    addDetailRow();
  }

  calcDetailTotals();
}
  
function calcDetailTotals(){
  let subtotal = 0;
  const globalRate = Number(document.getElementById("globalRate")?.value || 1);

  document.querySelectorAll("#detailBody tr").forEach(tr => {
    const lineType = tr.querySelector(".d-lineType")?.value || "DETAIL";

    if(lineType !== "DETAIL"){
      const amountInput = tr.querySelector(".d-amount");
      if(amountInput) amountInput.value = "";
      return;
    }

    const qty = Number(tr.querySelector(".d-qty").value || 0);
    const costPrice = Number(tr.querySelector(".d-cost").value || 0);
    let unitPrice = Number(tr.querySelector(".d-price").value || 0);

    // 仕入単価が入っていれば、仕入単価 × 全体掛け率
    if(costPrice !== 0){
  if(costPrice < 0){
    unitPrice = costPrice; // 値引きは掛け率なし
  } else {
    unitPrice = Math.round(costPrice * globalRate);
  }

  tr.querySelector(".d-price").value = unitPrice;
}

    const amount = qty * unitPrice;
    tr.querySelector(".d-amount").value = amount;

    subtotal += amount;
  });

  const tax = Math.floor(subtotal * 0.1);
  const total = subtotal + tax;

  document.getElementById("subtotalPreview").innerText = subtotal.toLocaleString();
  document.getElementById("taxPreview").innerText = tax.toLocaleString();
  document.getElementById("totalPreview").innerText = total.toLocaleString();

  return { subtotal, tax, total };
}

function getDetailRows(){
  const details = [];

  document.querySelectorAll("#detailBody tr").forEach(tr => {
    const lineType = tr.querySelector(".d-lineType")?.value || "DETAIL";
    const itemName = tr.querySelector(".d-item").value.trim();

    if(lineType === "BLANK"){
      details.push({
        lineType: "NOTE",
        itemName: "",
        specification: "",
        quantity: "",
        unit: "",
        costPrice: 0,
        unitPrice: 0,
        amount: 0,
        remark: ""
      });
      return;
    }

    if(itemName){
      const quantity = Number(tr.querySelector(".d-qty").value || 0);
      const costPrice = Number(tr.querySelector(".d-cost").value || 0);

      let unitPrice = 0;
      let amount = 0;

      if(lineType === "DETAIL"){
        unitPrice = Number(tr.querySelector(".d-price").value || 0);
        amount = Number(tr.querySelector(".d-amount").value || 0);
      }

      details.push({
        lineType: lineType,
        itemName: itemName,
        specification: tr.querySelector(".d-spec").value.trim(),
        quantity: lineType === "DETAIL" ? quantity : "",
        unit: lineType === "DETAIL" ? tr.querySelector(".d-unit").value.trim() : "",
        costPrice: costPrice,
        unitPrice: lineType === "DETAIL" ? unitPrice : "",
        amount: lineType === "DETAIL" ? amount : 0,
        remark: tr.querySelector(".d-remark").value.trim()
      });
    }
  });

  return details;
}

  
function saveEstimate(){
  const projectId = document.getElementById("newProjectId").value;
  const subject = document.getElementById("newSubject").value.trim();
  const details = getDetailRows();
  const totals = calcDetailTotals();
  const btn = document.querySelector('button[onclick="saveEstimate()"]');

  if(!projectId){
    alert("案件を選択してください");
    return;
  }

  if(!subject){
    alert("件名を入力してください");
    return;
  }

  if(details.length === 0){
    alert("明細を1行以上入力してください");
    return;
  }

  document.getElementById("loadingLayer").style.display = "block";
  document.getElementById("spinner").style.display = "block";
  document.getElementById("successIcon").style.display = "none";
  document.getElementById("loadingText").innerText = "保存中...";

  btn.disabled = true;
  btn.innerText = "保存中...";

  setTimeout(()=>{
    document.getElementById("loadingText").innerText = "PDF作成中...";
  }, 800);

  fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
   body: JSON.stringify({
  　　action: editingEstimateId ? "updateEstimateSimple" : "saveEstimateSimple",
  　　estimateId: editingEstimateId,
      companyId: currentUser.companyId,
      projectId: projectId,
      subject: subject,
      amount: totals.subtotal,
      subtotal: totals.subtotal,
      tax: totals.tax,
      total: totals.total,
      details: details,
      estimateNo: window.currentEstimateNo,
      createdBy: currentUser.userName
    })
  })
  .then(res => res.json())
  .then(res => {
    if(res.success){

      document.getElementById("spinner").style.display = "none";
      document.getElementById("successIcon").style.display = "block";
      document.getElementById("loadingText").innerText = "完了しました";

      document.getElementById("newProjectId").value = "";
      document.getElementById("newSubject").value = "";
      document.getElementById("selectedCustomer").innerText = "顧客：-";

      initDetailRows();
      
      loadEstimateList();
      loadNewEstimateNo();

      if(res.pdfUrl){
        window.open(res.pdfUrl, "_blank");
      }

      setTimeout(()=>{
        document.getElementById("loadingLayer").style.display = "none";
        document.getElementById("spinner").style.display = "block";
        document.getElementById("successIcon").style.display = "none";
        document.getElementById("loadingText").innerText = "保存中...";

        btn.disabled = false;
        btn.innerText = "保存";
      }, 1500);

    }else{
      document.getElementById("loadingLayer").style.display = "none";
      btn.disabled = false;
      btn.innerText = "保存";

      alert("保存失敗");
      console.log(res);
    }
  })
  .catch(err => {
    document.getElementById("loadingLayer").style.display = "none";
    btn.disabled = false;
    btn.innerText = "保存";

    alert("通信エラー");
    console.error(err);
  });
}

function editEstimate(estimateId){
  if(!estimateId){
    alert("見積IDがありません");
    return;
  }

  const url =
    GAS_URL +
    "?api=1&action=getEstimateEditData" +
    "&estimateId=" + encodeURIComponent(estimateId);

  fetch(url)
    .then(res => res.json())
    .then(res => {
      if(!res.success){
        alert("見積データの取得に失敗しました");
        console.log(res);
        return;
      }

      editingEstimateId = estimateId;

      const h = res.header;

      document.getElementById("newProjectId").value = h.projectId || "";
      document.getElementById("newSubject").value = h.subject || "";
      document.getElementById("estimateNoPreview").innerText =
        "見積番号：" + (h.estimateNo || "");

      window.currentEstimateNo = h.estimateNo || "";

      const tbody = document.getElementById("detailBody");
      tbody.innerHTML = "";

      (res.details || []).forEach(d => {
        addDetailRow(d);
      });

      if((res.details || []).length === 0){
        initDetailRows();
      }

      calcDetailTotals();

      const saveBtn = document.querySelector('button[onclick="saveEstimate()"]');
      if(saveBtn){
        saveBtn.innerText = "更新";
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    })
    .catch(err => {
      alert("通信エラー");
      console.error(err);
    });
}
