<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>建築見積システム</title>
<style>
body{
  font-family:sans-serif;
  background:linear-gradient(135deg,#eef2f7,#f8fafc);
  padding:30px;
}
.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:34px;
  border-radius:22px;
  box-shadow:0 18px 40px rgba(15,23,42,.12);
}
h1{
  text-align:center;
  color:#16324f;
  font-size:26px;
}
.sub{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-bottom:24px;
}
label{
  font-weight:bold;
  font-size:13px;
}
input{
  width:100%;
  padding:14px;
  margin:8px 0 16px;
  box-sizing:border-box;
  border:1px solid #d1d5db;
  border-radius:12px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#16324f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
#msg{
  color:#b42318;
  font-weight:bold;
  text-align:center;
  margin-top:14px;
}
#main{
  max-width:900px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  display:none;
}

#main{
  max-width:1100px;
}

#main button{
  width:auto;
  margin-right:10px;
  margin-bottom:10px;
}

#estimateSearch{
  width:100%;
  margin-top:18px;
  margin-bottom:18px;
}

#estimateList table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
  background:#fff;
}

#estimateList th{
  background:#16324f;
  color:#fff;
  padding:12px;
  font-size:13px;
  text-align:left;
}

#estimateList td{
  border-bottom:1px solid #e5e7eb;
  padding:12px;
  font-size:13px;
}

#estimateList tr:hover td{
  background:#f8fafc;
}

#estimateList a{
  display:inline-block;
  background:#2e7d32;
  color:#fff;
  padding:7px 12px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:768px){
  #estimateList{
    overflow-x:auto;
  }

  #estimateList table{
    min-width:900px;
  }
}  

 #estimateList tr{
  cursor:pointer;
} 

 #newProjectId{
  width:100%;
  padding:12px;
  margin-top:10px;
  margin-bottom:16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:14px;
} 

 #newProjectId{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
} 

#loadingLayer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:9999;
}

.loading-box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  padding:30px 40px;
  border-radius:20px;
  text-align:center;
}

.spinner{
  width:40px;
  height:40px;
  margin:0 auto 15px;
  border:4px solid #ddd;
  border-top:4px solid #16324f;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}  

.checkmark{
  font-size:48px;
  color:#2e7d32;
  margin-bottom:10px;
  animation:pop .4s ease;
}

@keyframes pop{
  0%{transform:scale(0);}
  70%{transform:scale(1.2);}
  100%{transform:scale(1);}
}  
</style>
</head>
<body>

<div id="login" class="login-box">
  <h1>建築見積システム</h1>
  <div class="sub">Estimate & Invoice Management</div>

  <label>ログインID</label>
  <input id="loginId" type="text">

  <label>パスワード</label>
  <input id="password" type="password">

  <button onclick="login()">ログイン</button>

  <div id="msg"></div>
</div>

<div id="main">
  <h2 id="welcome"></h2>

  <button onclick="loadEstimateList()">見積一覧を表示</button>
  <button onclick="logout()">ログアウト</button>

   <div style="margin-top:20px; padding:15px; background:#f1f5f9; border-radius:10px;">
  <h3>新規見積作成</h3>

   <select id="newProjectId">
  <option value="">案件を選択してください</option>
　　</select>

  <div id="selectedCustomer" style="margin-bottom:10px; font-weight:bold; color:#16324f;">
  顧客：-
</div>   

    <div id="estimateNoPreview" style="margin-bottom:10px; font-weight:bold; color:#0f172a;">
  見積番号：-
</div> 

  <input id="newSubject" placeholder="件名（例：内装工事）">
  <input id="newAmount" placeholder="金額">

  <button onclick="saveEstimate()">保存</button>
</div>

  <input id="estimateSearch" placeholder="顧客名・案件名・見積番号で検索" oninput="renderEstimateList()" style="margin-top:20px;">

  <div id="estimateList"></div>
</div>
 
 

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwWXaFfTmenoNAG8BBO4hxwB6cd69TYocFIx-s9uKIUPz27_tiedtbPGIA_f8kSaYLkTA/exec";
let currentUser = null;

function login(){
  const loginId = document.getElementById("loginId").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!loginId || !password){
    document.getElementById("msg").innerText = "ログインIDとパスワードを入力してください";
    return;
  }

  document.getElementById("msg").innerText = "ログイン確認中...";

  const url =
    GAS_URL +
    "?api=1&action=login" +
    "&loginId=" + encodeURIComponent(loginId) +
    "&password=" + encodeURIComponent(password);

  fetch(url)
    .then(res => res.json())
    .then(res => {
      if(res.success){
        currentUser = res;

        document.getElementById("login").style.display = "none";
        document.getElementById("main").style.display = "block";
        document.getElementById("welcome").innerText =
          "ようこそ " + res.userName + " さん";

        loadEstimateList();
      loadProjectsForSelect();
        loadNewEstimateNo(); // ←これ追加

      }else{
        document.getElementById("msg").innerText =
          "ログインID または パスワードが違います";
      }
    })
    .catch(err => {
      document.getElementById("msg").innerText =
        "通信エラーです。GAS URLまたはデプロイ設定を確認してください。";
      console.error(err);
    });
}

function logout(){
  currentUser = null;
  document.getElementById("main").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("password").value = "";
  document.getElementById("msg").innerText = "";
}


let estimateData = [];

function loadEstimateList(){
  if(!currentUser){
    alert("ログインしてください");
    return;
  }

  document.getElementById("estimateList").innerHTML = "読み込み中...";

  const url =
    GAS_URL +
    "?api=1&action=estimateList" +
    "&companyId=" + encodeURIComponent(currentUser.companyId);

  fetch(url)
    .then(res => res.json())
    .then(data => {
      estimateData = data || [];
      renderEstimateList();
    })
    .catch(err => {
      document.getElementById("estimateList").innerHTML =
        "見積一覧の取得に失敗しました";
      console.error(err);
    });
}

function renderEstimateList(){
  const keyword = document.getElementById("estimateSearch").value.trim().toLowerCase();
  const area = document.getElementById("estimateList");

  const filtered = estimateData.filter(row => {
    return (
      String(row.estimateNo || "").toLowerCase().includes(keyword) ||
      String(row.customerName || "").toLowerCase().includes(keyword) ||
      String(row.projectName || "").toLowerCase().includes(keyword) ||
      String(row.subject || "").toLowerCase().includes(keyword)
    );
  });

  if(filtered.length === 0){
    area.innerHTML = "<p>見積データがありません。</p>";
    return;
  }

  let html = `
    <table>
      <tr>
        <th>見積番号</th>
        <th>発行日</th>
        <th>顧客名</th>
        <th>案件名</th>
        <th>件名</th>
        <th>金額</th>
        <th>状態</th>
        <th>PDF</th>
      </tr>
  `;

  filtered.forEach(row => {
    html += `
      <tr onclick="openPdf('${row.pdfUrl}')">
        <td>${escapeHtml(row.estimateNo)}</td>
        <td>${escapeHtml(row.issueDate)}</td>
        <td>${escapeHtml(row.customerName)}</td>
        <td>${escapeHtml(row.projectName)}</td>
        <td>${escapeHtml(row.subject)}</td>
        <td>${Number(row.grandTotal || 0).toLocaleString()}円</td>
        <td>${escapeHtml(row.status)}</td>
        <td>
          ${row.pdfUrl 
  ? `<a href="${row.pdfUrl}" target="_blank" onclick="event.stopPropagation()">開く</a>` 
  : ""
}
        </td>
      </tr>
    `;
  });

  html += "</table>";
  area.innerHTML = html;
}

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function openPdf(url){
  if(url){
    window.open(url, "_blank");
  }
}


function saveEstimate(){
  const projectId = document.getElementById("newProjectId").value;
  const subject = document.getElementById("newSubject").value.trim();
  const amount = Number(document.getElementById("newAmount").value);
  const btn = document.querySelector('button[onclick="saveEstimate()"]');

  if(!projectId){
    alert("案件を選択してください");
    return;
  }

  if(!subject || !amount){
    alert("件名と金額を入力してください");
    return;
  }

  // ローディング初期化
  document.getElementById("loadingLayer").style.display = "block";
  document.getElementById("spinner").style.display = "block";
  document.getElementById("successIcon").style.display = "none";
  document.getElementById("loadingText").innerText = "保存中...";

  // ボタン連打防止
  btn.disabled = true;
  btn.innerText = "保存中...";

  setTimeout(()=>{
    document.getElementById("loadingText").innerText = "PDF作成中...";
  }, 800);

  fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      action: "saveEstimateSimple",
      companyId: currentUser.companyId,
      projectId: projectId,
      subject: subject,
      amount: amount,
      estimateNo: window.currentEstimateNo,
      createdBy: currentUser.userName
    })
  })
  .then(res => res.json())
  .then(res => {
    if(res.success){

      document.getElementById("spinner").style.display = "none";
      document.getElementById("successIcon").style.display = "block";
      document.getElementById("loadingText").innerText = "完了しました";

      document.getElementById("newProjectId").value = "";
      document.getElementById("newSubject").value = "";
      document.getElementById("newAmount").value = "";
      document.getElementById("selectedCustomer").innerText = "顧客：-";

      loadEstimateList();
      loadNewEstimateNo();

      if(res.pdfUrl){
        window.open(res.pdfUrl, "_blank");
      }

      setTimeout(()=>{
        document.getElementById("loadingLayer").style.display = "none";
        document.getElementById("spinner").style.display = "block";
        document.getElementById("successIcon").style.display = "none";
        document.getElementById("loadingText").innerText = "保存中...";

        btn.disabled = false;
        btn.innerText = "保存";
      }, 1500);

    }else{
      document.getElementById("loadingLayer").style.display = "none";
      btn.disabled = false;
      btn.innerText = "保存";

      alert("保存失敗");
      console.log(res);
    }
  })
  .catch(err => {
    document.getElementById("loadingLayer").style.display = "none";
    btn.disabled = false;
    btn.innerText = "保存";

    alert("通信エラー");
    console.error(err);
  });
}

 function loadProjectsForSelect(){
  const select = document.getElementById("newProjectId");
  if(!select || !currentUser) return;

  select.innerHTML = `<option value="">案件を選択してください</option>`;

  const url =
    GAS_URL +
    "?api=1&action=projects" +
    "&companyId=" + encodeURIComponent(currentUser.companyId);

  fetch(url)
    .then(res => res.json())
    .then(projects => {

      // 👇 これ追加（グローバルに保持）
      window.projectList = projects;

      projects.forEach(p => {
        const option = document.createElement("option");
        option.value = p.projectId;
        option.textContent =
          `${p.customerName} / ${p.projectName}`;
        select.appendChild(option);
      });
    });
}

document.addEventListener("change", function(e){
  if(e.target.id === "newProjectId"){
    const selectedId = e.target.value;

    const project = (window.projectList || []).find(p => p.projectId === selectedId);

    if(project){
      // 件名自動入力
      document.getElementById("newSubject").value = project.projectName;

      // 👇 顧客名表示
      document.getElementById("selectedCustomer").innerText =
        "顧客：" + project.customerName;
    }else{
      document.getElementById("selectedCustomer").innerText = "顧客：-";
    }
  }
});

function loadNewEstimateNo(){
  const url = GAS_URL + "?api=1&action=newEstimateNo";

  fetch(url)
    .then(res => res.json())
    .then(res => {
      if(res.estimateNo){
        document.getElementById("estimateNoPreview").innerText =
          "見積番号：" + res.estimateNo;

        window.currentEstimateNo = res.estimateNo;
      }
    });
}  
  
</script>
<script>
  // ←ここにJSがある
</script>

<!-- 👇ここに追加 -->
<div id="loadingLayer" style="display:none;">
  <div class="loading-box">

    <!-- くるくる -->
    <div id="spinner" class="spinner"></div>

    <!-- チェック（最初は非表示） -->
    <div id="successIcon" class="checkmark" style="display:none;">✓</div>

    <!-- テキスト -->
    <div id="loadingText">保存中...</div>

  </div>
</div>

</body>
</html>
</body>
</html>
